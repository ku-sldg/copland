- name: Copland Core Definition
  version: 0.0
  description: Core definition of the Copland abstract syntax and semantics.  This reflects the semantics of Copland in the "Orchestrating Layered Attestations" paper.
  file: "resources/coplandcoq.tar.gz"
  docs: "resources/coplandcoq/index.html"
- name: CakeML Attestation Manager
